# Pyrefly configuration for FUSION NEURAL project
# Tells Pyrefly to use the backend's virtual environment interpreter
# so it correctly resolves fastapi, httpx, pydantic, etc.

python_interpreter = "backend/venv/Scripts/python.exe"

[project]
include = ["backend/**/*.py"]
# Exclude virtual inmemory files pyrefly creates for snippet analysis
exclude = ["**/__pyrefly_virtual__/**", "**/inmemory/**"]
# Explicitly tell Pyrefly to resolve imports relative to the backend/ folder
# so that `routers.*` and `services.*` are found correctly.
search_roots = ["backend"]
