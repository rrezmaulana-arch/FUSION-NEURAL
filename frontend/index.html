          "@type": "Offer",

          "price": "1800000",
          "priceCurrency": "IDR"
        },
        {
          "@type": "Offer",
          "name": "Full One Man Company",
          "price": "4800000",
          "priceCurrency": "IDR"
        }
      ],
      "author": {
        "@type": "Person",
        "name": "Miftah Afreza Maulana"
      }

    <!-- Fonts -->
